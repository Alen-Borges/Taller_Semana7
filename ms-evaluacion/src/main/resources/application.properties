spring.application.name=ms-evaluacion
server.port=${SERVER_PORT:8083}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/seguros_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=eval_schema
spring.jpa.show-sql=false

# Crear el schema eval_schema antes de que Hibernate ejecute el DDL
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS eval_schema
