spring.application.name=ms-authservice
server.port=${SERVER_PORT:8081}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/seguros_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=auth_schema
spring.jpa.show-sql=false

# Crear el schema auth_schema antes de que Hibernate ejecute el DDL
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS auth_schema

# JWT
jwt.secret=${JWT_SECRET:c2VndXJvc0V2YWx1YWRvckF1dG9tYXRpemFkb1NlY3JldEtleUZvckpXVDIwMjY=}
jwt.expiration=${JWT_EXPIRATION:86400000}
