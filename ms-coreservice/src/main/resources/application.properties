spring.application.name=ms-coreservice
server.port=${SERVER_PORT:8082}

# evaluacion-service URL (spec §2.1 — puerto 8083)
evaluacion.service.url=${EVALUACION_SERVICE_URL:http://localhost:8083}

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/seguros_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Config (listo para cuando compañero implemente auth)
jwt.secret=${JWT_SECRET:c2VndXJvc0V2YWx1YWRvckF1dG9tYXRpemFkb1NlY3JldEtleUZvckpXVDIwMjY=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart (fotografías de reclamos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Almacenamiento de fotografías (override en Docker con variable de entorno)
app.storage.location=${STORAGE_LOCATION:./uploads}
